# 테마 축과 축마다 고를 수 있는 값. suit.py 와 웹 고르개가 읽는다.
# 형식은 YAML 의 부분집합이다. 맨 앞 칸에 축 이름, 들여 쓴 줄에 `값: 이름` 하나. `label` 은 축의 이름이다.
# 값을 더하면 themes/<언어>/<축>/<값>.md 를 같이 만들고 `python3 suit.py bundle` 로 웹 묶음을 다시 만든다.
# 값 `template` 은 문서 종류가 고정할 때만 쓴다. 그 축은 themes/kinds/<종류>.md 가 정한다.

visual-doc:
  label: 디자인 · 문서
  sakura: Sakura
  newcss: new.css

visual-deck:
  label: 디자인 · 발표
  paper: 종이 톤
  contrast: 어두운 고대비
  minimal: 흰 바탕 한 색

voice:
  label: 문체
  prose: 줄글
  bullet: 개조식

register:
  label: 어법
  plain: 평어체 (-다)
  polite: 합쇼체 (-습니다)
  haeyo: 해요체 (-요)

terms:
