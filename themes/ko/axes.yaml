  everyday: 일상어
  explained: 풀어 쓰고 전문어 곁들임
  major: 전문 용어 그대로

skeleton:
  label: 골격
  bluf: 결론 먼저
  chrono: 시간순
  pcs: 문제 · 원인 · 대책
  imrad: 목적 · 방법 · 결과 · 고찰
  psr: 문제 · 해결 · 효과

length:
  label: 분량
  brief: 짧게
  page: 한 쪽
  full: 상세

emphasis:
  label: 강조
  bold: 굵은 글씨
  none: 쓰지 않음

diagram:
  label: 그림
  table: 표 먼저
  mermaid: mermaid
  none: 그리지 않음

sources:
