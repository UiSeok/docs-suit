# bootstrap 이 묻는 페르소나 질문. 답은 프로필의 persona 절에 남고, 조립한 지침의 "쓰는 사람" 절에 실린다.
# docs 는 지침에 싣지 않고, 주력 문서 종류를 고르는 데만 쓴다.
# 순서는 아래 키 순서이고, 값은 {label: 질문 이름, ask: 묻는 말, hint: 예시} 한 줄 묶음이다.

questions:
  call: {label: 호칭, ask: AI 가 나를 뭐라고 부르면 좋을까요?, hint: 예) 민수 님}
  affiliation: {label: 소속, ask: 지금 어디서 무엇을 하나요?, hint: 예) 공간정보공학과 3학년 / 백엔드 개발 2년 차}
  goal: {label: 목표, ask: 요즘 글쓰기로 이루고 싶은 목표는?, hint: 예) 하반기 백엔드 공채 서류 통과}
  docs: {label: 자주 쓰는 문서, ask: 자주 쓰는 문서를 골라 주세요. 번호를 쉼표로 이어 씁니다, hint: "예) 1,3"}
  facts: {label: AI 가 모르는 나, ask: AI 가 모르는데 알면 도움이 될 나에 대한 사실은?, hint: 예) 공간 데이터 분석을 해 봤고 지도 시각화를 좋아한다}
  dislikes: {label: 싫어하는 말투, ask: 피하고 싶은 말투나 표현이 있나요?, hint: "예) 과장된 형용사, 번역투, 이모지"}
