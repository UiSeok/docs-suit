# 캐릭터 성장 규칙. suit.py check 가 남긴 기록에서 경험치와 레벨을 매번 다시 계산한다.
# 규칙을 고치면 지난 기록에도 새 규칙이 적용된다. 분량과 연속 기록은 세지 않고, 경험치는 깎지 않는다.

# 문서 한 건이 받는 경험치. 같은 문서를 다시 검사하면 그 문서의 기록 가운데 가장 좋은 것을 센다.
# resolved 는 [확인 필요] 가 남아 있던 문서를 채워 다시 검사했을 때만 준다. 빈칸을 숨긴 글이 점수를 받지 않게 한다.
exp:
  done: {points: 10, label: 마침}
  clean: {points: 10, label: 규칙 지킴}
  resolved: {points: 5, label: 확인 필요 채움}
  new-kind: {points: 20, label: 처음 쓴 종류}

limit:
  daily-kind: 2  # 같은 날 같은 종류는 이 건수까지만 경험치를 준다

# 1레벨에서 2레벨로 가는 데 base 가 들고, 레벨이 오를 때마다 step 만큼 더 든다.
level:
  base: 50
  step: 25

# 전직 문턱 레벨. 1차부터 4차까지이고, 칭호는 classes/<클래스>.yaml 의 titles 를 쓴다.
# 진급 퀘스트를 정하기 전까지는 레벨만 본다.
promote:
  1: 3
  2: 7
  3: 12
  4: 18
