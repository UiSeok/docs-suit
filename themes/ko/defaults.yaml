# 중립 기본값과 독자 풀, 문서 종류 풀. suit.py 와 웹 고르개가 읽는다.
# 클래스(직업)는 classes/<id>.yaml 에 있고, 이 풀에서 주력 문서 종류를 고르고 기본값을 얹는다.
# 형식은 YAML 의 부분집합이다. 맨 앞 칸에 절 이름, 들여 쓴 줄에 키 하나와 값 하나.
# 값은 낱말이거나 `[a, b]` 목록이거나 `{키: 값, …}` 한 줄 묶음이다. 묶음 안에 묶음을 넣지 않는다.
#
# 값을 정하는 순서 (위가 이긴다)
#   1. 문서 종류가 고정한 축      kinds
#   2. 명령 인자                  --set 축=값
#   3. 프로필의 독자별 값          ~/.config/docs-suit/profile.yaml 의 audiences
#   4. 문서 종류가 권하는 값       prefer
#   5. 프로필의 기본값            프로필의 defaults
#   6. 독자 프로필                audiences
#   7. 클래스 기본값              classes/<id>.yaml 의 defaults
#   8. 중립 기본값                defaults
# 공개 범위(exposure)는 안전 축이다. 1, 6, 7, 8 단계가 정한 값이 출발점이고, 인자와 프로필은 더 좁힐 때만 이긴다.
# 좁은 순서는 public, submit, team 이다. 독자를 말하지 않으면 문서 종류의 audience 를 쓴다.

defaults:
  visual-doc: sakura
  visual-deck: minimal
  voice: prose
  register: plain
  terms: explained
  skeleton: bluf
  length: page
  emphasis: bold
  diagram: table
  sources: footnote
  exposure: public
  ai-disclosure: none

# 독자 풀. label 은 사람이 부르는 이름이고 나머지 키는 축이다.
audiences:
  professor: {label: 교수·지도교수, voice: prose, register: plain, terms: major, length: full, exposure: submit}
  teammate: {label: 팀원·동료, voice: bullet, register: haeyo, terms: explained, exposure: team}
  recruiter: {label: 채용 담당·면접관, voice: bullet, register: polite, terms: explained, exposure: submit}
  listener: {label: 발표 청중, voice: bullet, register: polite, terms: everyday, length: brief, exposure: public}
  reader: {label: 인터넷 독자·구독자, voice: prose, register: haeyo, terms: explained, exposure: public, sources: link}
  peer-dev: {label: 동료 개발자, voice: bullet, register: plain, terms: major, exposure: team}
  manager: {label: 상사·리더, voice: bullet, register: polite, terms: everyday, length: brief, exposure: team}
  stakeholder: {label: 다른 팀·외부 협력, register: polite, terms: explained, exposure: submit}
  reviewer: {label: 심사위원·리뷰어, register: plain, terms: major, exposure: submit}

# 문서 종류 풀. audience 는 독자를 말하지 않을 때 쓰는 기본 독자이고, 나머지 축 키는 그 종류가 고정하는 값이다.
# 값 template 은 그 축을 kinds/<종류>.md 의 틀이 정한다는 뜻이다.
kinds:
  report: {label: 보고서·레포트, audience: [professor]}
  slides: {label: 발표 자료, audience: [listener], skeleton: template, voice: bullet}
  minutes: {label: 회의록·공유자료, audience: [teammate], skeleton: template}
  email: {label: 메일, audience: [stakeholder], skeleton: template, diagram: none}
  resume: {label: 이력서, audience: [recruiter], skeleton: template, ai-disclosure: none}
  cover-letter: {label: 자기소개서, audience: [recruiter], skeleton: template, voice: prose, diagram: none, ai-disclosure: none}
  portfolio: {label: 포트폴리오, audience: [recruiter], skeleton: template}
  interview: {label: 면접 답변, audience: [recruiter], skeleton: template, voice: prose, diagram: none, ai-disclosure: none}
  abstract: {label: 논문 초록, audience: [reviewer], skeleton: template, voice: prose, diagram: none}
  proposal: {label: 연구계획서·제안서, audience: [reviewer], skeleton: template}
  design-doc: {label: 설계 문서, audience: [peer-dev], skeleton: template}
  pr: {label: PR 설명, audience: [peer-dev], skeleton: template, ai-disclosure: none}
  postmortem: {label: 사건 회고, audience: [peer-dev], skeleton: template}
  spec: {label: 기획서, audience: [stakeholder], skeleton: template}
  work-report: {label: 업무 보고, audience: [manager]}
  blog: {label: 블로그·기술 글, audience: [reader], skeleton: template}
  newsletter: {label: 뉴스레터, audience: [reader], skeleton: template}
  sns: {label: SNS 글, audience: [reader], skeleton: template, diagram: none, sources: link}

# 문서 종류가 권하는 값. 고정은 아니라서 인자와 프로필의 독자별 값이 바꿀 수 있다.
prefer:
  report: {skeleton: imrad, sources: footnote, length: full}
  slides: {length: brief}
  minutes: {voice: bullet, length: brief, diagram: table}
  email: {register: polite, length: brief, emphasis: none}
  resume: {voice: bullet, diagram: none}
  cover-letter: {register: polite}
  portfolio: {voice: bullet, diagram: table}
  interview: {register: polite, length: brief}
  abstract: {length: brief, terms: major}
  proposal: {length: full, sources: apa}
  design-doc: {diagram: mermaid, terms: major}
  pr: {voice: bullet, length: brief, terms: major}
  postmortem: {length: full}
  spec: {diagram: table}
  work-report: {skeleton: bluf, voice: bullet, length: brief}
  blog: {sources: link}
  newsletter: {sources: link}
  sns: {length: brief, emphasis: none}
