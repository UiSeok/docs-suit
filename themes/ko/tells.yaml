# 본문 검사 패턴. suit.py check 가 공통 바닥의 문장 규칙과 상투 표현 규칙을 어림 기준으로 잰다.
# 형식은 YAML 의 부분집합이다. 들여 쓴 줄 하나가 패턴 하나이고, 값은 `{키: 값, …}` 한 줄 묶음이다.
#
# layer  error 는 ✗ 로 보여 고쳐 쓰게 하고 성장의 "규칙 지킴" 에 든다. suggest 는 △ 로 보이기만 한다.
#        정해진 문형만 error 로 둔다. 사람 글에도 흔한 표현은 밀도로 재고 suggest 로 둔다.
# re     파이썬 정규식. 줄 단위(MULTILINE)로 찾는다. 큰따옴표로 감싸고 안에는 큰따옴표를 쓰지 않는다.
# min    문서 안에서 이만큼 나와야 걸린다. 없으면 1 이다.
# per    para 면 한 문단 안에서 min 을 센다. 없으면 문서 전체에서 센다.
# raw    true 면 걷어 내지 않은 원문에서 찾는다. 없으면 코드 블록, 인용 블록, 따옴표와 백틱 안을 걷고 찾는다.
# skip   이 패턴을 재지 않는 문서 종류.
# exposure  공개 범위가 이 값일 때만 잰다.
#
# 아이디어를 빌린 곳은 PROVENANCE.md 에 있다. 패턴과 문구는 새로 썼다.
# selftest 는 모든 값의 `## 보기` 에서 error 패턴이 하나도 걸리지 않는지 잰다.

tells:
  dash: {layer: error, label: 대시, re: "(?<![0-9])[—–]|[—–](?![0-9])", hint: 연결어미로 잇거나 문장을 나눈다}
  passive2: {layer: error, label: 이중 피동, re: "(?:되어|보여)(?:지|져|졌|진|질|짐)", hint: "되다, 보이다 로 줄인다"}
  meta: {layer: error, label: 예고와 인사, re: "(?:알아|살펴|짚어)(?:보겠습니다|보겠다|봅시다|보자|볼게요|보도록 하겠습니다)|도움이 (?:되|됐|되었)[^.\n]{0,8}(?:바랍니다|바란다|바라요)|좋은 질문|궁금한 (?:점|사항)이 있(?:으시)?면|AI 언어 모델|제가 아는 범위", hint: 예고와 인사를 빼고 바로 본론을 쓴다}
  count: {layer: error, label: 수사 서술어, re: "(?<![가-힣])(?<!중 )(?<!중의 )(?<!중에서 )(?<!가운데 )하나(?:다|입니다|예요|이고|이며|였다|였고|이었다|이지만|라서|라|인데|이므로|이니까|이던|였는데|이었는데)(?![가-힣])|(?<![가-힣])(?<!데이터 )(?:둘|셋|넷|다섯|여섯|일곱|여덟|아홉)(?:이다|입니다|이에요|이고|이며|이었다|이었고|이지만|이라서|이라|인데|이므로|이니까|이던|이었는데)|(?<![가-힣])(?<!데이터 )(?:둘로|셋으로|넷으로|다섯으로|여섯으로)|(?<![가-힣])(?:이|그|저|이들|그들) (?:둘|셋|넷|다섯|여섯)(?:을|를|은|는|이|가|의|과|와|도|만)(?![가-힣])", hint: "세 가지, 네 군데 처럼 단위 명사로 센다"}
  placeholder: {layer: error, label: 남은 자리표시, re: "\[(?:이름|성명|회사명|회사 이름|날짜|연락처|전화번호|이메일|주소|직무|직책|학교|학번|소속|금액|수치|링크)\]|○○|〇〇|OOO|20[0-9]X|XX-XX", hint: "채우거나 [확인 필요: 무엇을] 으로 바꾼다"}
  secret: {layer: error, label: 비밀값, re: "\b(?:sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[abp]-[A-Za-z0-9-]{10,})|(?:비밀번호|패스워드|password|passwd)\s*[:=]\s*\S{4,}", raw: true, hint: 키와 비밀번호는 문서에서 빼고 따로 전한다}

  contact: {layer: suggest, label: 연락처, re: "01[016789][- .]?[0-9]{3,4}[- .]?[0-9]{4}|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z.]{2,}", raw: true, exposure: public, hint: 인터넷에 공개해도 되는 연락처인지 확인한다}
  not-but: {layer: suggest, label: X 가 아니라 Y 대구, re: "아니라", min: 2, hint: 대구는 한 번만 남기고 나머지는 주장으로 바로 쓴다}
  beyond: {layer: suggest, label: 단순한 X 를 넘어, re: "단순(?:한|히) [^.\n]{1,20}?(?:을|를) 넘어", hint: 넘어선다는 말 대신 무엇을 하는지 쓴다}
  cleft: {layer: suggest, label: 중요한 것은, re: "(?:중요한|필요한|핵심적인|주목할) (?:것은|점은)", hint: 중요한 그것을 주어로 바로 주장한다}
  important: {layer: suggest, label: 가 중요하다, re: "(?:이|가) (?:중요|필수적)(?:하다|합니다|해요|이다|입니다)", min: 2, hint: 왜 중요한지를 수치나 결과로 쓴다}
  wrapup: {layer: suggest, label: 맺음 상투어, re: "결론적으로|궁극적으로|요약하(?:면|자면)|종합하(?:면|자면)|정리하자면|결국 [^.\n]{0,30}(?:이어진다|이어집니다|직결)|하는 이유(?:다|입니다)\.", hint: 맺음말로 되풀이하지 말고 결론을 앞에 둔다}
  vague: {layer: suggest, label: 정보 없는 수식어, re: "다양한|효율적(?:인|으로)|적절한|혁신적|획기적|게임 ?체인저|패러다임|차세대|무한한 가능성|중추적|이정표|시너지|원활한|극대화|일환으로|자리매김|강력한|완벽한|최적의", hint: 구체적인 명사와 수치로 바꾼다}
  hedge: {layer: suggest, label: 겹친 완곡, re: "수(?:도)? 있을 것(?:으로|이라|같)|것으로 보일 수", hint: 근거만큼만 단정한다}
  particles: {layer: suggest, label: 이중 조사, re: "(?:에서|으로|로부터|에게서|에)의 ", min: 3, hint: "에서의, 으로의 를 동사로 풀어 쓴다"}
  passive-run: {layer: suggest, label: 피동 진행, re: "(?:되|지)고 있(?:다|습니다|어요)", min: 3, per: para, hint: 누가 무엇을 하는지 능동으로 쓴다}
  ground: {layer: suggest, label: 기반 은유, re: "(?:발판|토대|초석|지평)(?:을|를) ?(?:마련|놓|열)", hint: 무엇을 할 수 있게 되는지 쓴다}
  compare: {layer: suggest, label: 비교 부사 보다, re: "(?:^|\s)보다 (?:더 )?[가-힣]+(?:적인|적으로|한|하게)(?![가-힣])", hint: 보다 대신 더 를 쓴다}
  paren-sentence: {layer: suggest, label: 괄호 안 문장, re: "\([^()\n]*(?:다|요)\.[^()\n]*\)", hint: 괄호를 풀어 다음 문장으로 쓴다}
  bold-label: {layer: suggest, label: 굵은 라벨 목록, re: "^\s*(?:[-*+]|[0-9]+[.)])\s+\*\*[^*\n]+\*\*\s*[:：]", min: 2, hint: 완결된 문장의 목록이나 줄글로 쓴다}
  colon-head: {layer: suggest, label: 쌍점 부제 제목, re: "^#{1,6} [^\n]*[:：]", hint: 제목은 쌍점 없이 주장 한 줄로 쓴다}
  emoji-head: {layer: suggest, label: 이모지로 시작하는 줄, re: "^\s*(?:[-*+]\s+)?[\U0001F300-\U0001FAFF☀-➿⭐]", skip: [sns], hint: 이모지를 빼고 낱말로 쓴다}
