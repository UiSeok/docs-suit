<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docs-suit · 테마 설정</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>docs-suit</h1>
    <p class="nav"><a href="index.html#character">캐릭터</a> · <a href="index.html#setup">캐릭터 설정</a> · <b>테마 설정</b></p>
  </header>
  <div id="local"></div>
  <div class="layout">
    <div>
      <section class="kindbar">
        <h2 class="kindtitle" id="kindTitle"></h2>
        <p class="note" id="kindNote"></p>
        <details class="fold" id="kindPick">
          <summary>다른 문서 종류</summary>
          <div class="web-only">
            <p class="kgroup">클래스</p>
            <div class="chips small" id="classes"></div>
          </div>
          <div id="kinds"></div>
        </details>
      </section>
      <div id="gallery"></div>
      <details class="fold more" id="more">
        <summary id="moreSum">더 바꾸기</summary>
        <div class="audrow"><span>독자로 미리 보기</span><div class="chips small" id="auds"></div></div>
        <div id="gallery2"></div>
      </details>
    </div>
    <aside class="out" aria-label="고른 값">
      <section class="local-only pickbox">
        <ul class="picked" id="picked"></ul>
        <div class="actions">
          <button type="button" class="btn primary" id="apply">이번 문서에만 적용</button>
          <button type="button" class="btn" id="save">이 종류에 저장</button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <details class="fold opts">
          <summary>옵션</summary>
          <div class="row"><label><input type="checkbox" id="here"> 저장은 실행한 폴더에서만</label></div>
          <div class="row">
            <button type="button" class="btn link" id="reset">고른 것 지우기</button>
            <button type="button" class="btn link" id="clearKind" hidden>이 종류를 기본으로 되돌리기</button>
          </div>
        </details>
      </section>
      <details class="fold guide" id="guide">
        <summary>조립된 지침 보기·복사</summary>
        <div class="row">
          <label><input type="radio" name="fmt" value="prompt" checked> 붙여 넣기용</label>
          <label><input type="radio" name="fmt" value="output-style"> Claude Code output style</label>
        </div>
        <div class="row">
          <label>글자수 <input id="chars" type="number" min="100" step="100" placeholder="공백 포함"></label>
          <label><input type="checkbox" id="revise"> 원문 다듬기</label>
        </div>
        <textarea id="out" readonly spellcheck="false"></textarea>
        <div class="actions">
          <button type="button" class="btn primary" id="copy">복사</button>
          <button type="button" class="btn" id="copyReview">검토 지침 복사</button>
          <button type="button" class="btn" id="download">.md 로 저장</button>
          <button type="button" class="btn web-only" id="webSave">이 종류에 저장</button>
        </div>
        <div class="status web-only" id="webStatus" aria-live="polite"></div>
        <div class="where">
          붙여 넣는 자리
          <ul>
            <li>ChatGPT: 맞춤형 지침, 프로젝트 지침</li>
            <li>Claude: 프로젝트 지침, 스타일의 "직접 설명"</li>
            <li>Gemini: Gem 지침</li>
            <li>Claude Code: output style 로 저장해 <code>~/.claude/output-styles/</code></li>
          </ul>
        </div>
      </details>
      <div class="warn" id="warns" aria-live="polite"></div>
    </aside>
  </div>
</main>
<script src="local.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
